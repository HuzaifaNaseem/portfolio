<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0a0f">
    <title>Page not found — Muhammad Huzaifa Naseem</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@700;800&display=swap"
        rel="stylesheet">
    <!-- Self-contained on purpose: a 404 must render even if styles.css
         is the thing that failed to load. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }
        .orb-1 { width: 420px; height: 420px; background: #6366f1; top: -120px; left: -100px; }
        .orb-2 { width: 360px; height: 360px; background: #ec4899; bottom: -140px; right: -80px; }

        main { position: relative; padding: 2rem; max-width: 560px; }

        .tag {
            font-family: ui-monospace, 'Cascadia Code', 'SF Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #6b6b85;
        }

        h1 {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 800;
            font-size: clamp(6rem, 22vw, 10rem);
            line-height: 1;
            margin: 0.5rem 0 0.8rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        p { color: #a0a0b8; font-size: 1.05rem; line-height: 1.6; }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 2.2rem;
            padding: 0.95rem 2rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
        }
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>

<body>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <main>
        <p class="tag">Error 404</p>
        <h1>404</h1>
        <p>This page does not exist, but the work does.<br>Let me show you the way back.</p>
        <a class="home-btn" href="/">
            Back to the portfolio
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
        </a>
    </main>
</body>

</html>
